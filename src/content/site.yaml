bio: >-
  I am a master's student at National Tsing Hua University, advised by Prof. Min Sun,
  and I work with Prof. Tsung-Wei Ke at National Taiwan University. Before that I was a
  research assistant at CITI, Academia Sinica, with Dr. Jun-Cheng Chen, and received a
  B.S. in Electrical Engineering and Computer Science from National Central University.
status: I am seeking Visiting Student / PhD opportunities  for 2027!   # set to "" after decisions
statement: >-
  I study how machines infer physical dynamics from what they see. Instead of training
  end-to-end predictors, I decompose visual representations along the causal structure
  of the physical process, so that geometry, material and dynamics can each be checked
  and adapted. My recent work, DELPHI and ADYTON establish a way to learn 4D deformable
  dynamics from RGB-D videos. We aim to build a general 4D Physics World Model for robotic
  decision-making. 

pubGroups:
  - { id: dynamics, label: "4D Physics Dynamics From Vision" }
  - { id: generative, label: "Generative Diffusion Models" }

