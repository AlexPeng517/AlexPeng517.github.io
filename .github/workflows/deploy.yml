name: Deploy to GitHub Pages

# Builds the Astro site and publishes dist/ to the gh-pages branch,
# which is the branch GitHub Pages serves this site from.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish dist/ to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
